<!DOCTYPE html>
<html>
<head>
  <base target="_top" />
  <style>
    body { font-family: system-ui; padding:16px; margin:0; background:#fafafa; }
    table { width:100%; border-collapse:collapse; }
    th, td { border:1px solid #ddd; padding:6px; font-size:13px; }
    th { background:#f0f0f0; }
    input, select { width:100%; box-sizing:border-box; }
    .readonly { background:#f9f9f9; }
    .hidden { display:none; }
    .green { color:green; font-weight:600; }
    .red { color:red; font-weight:600; }
    .reverse-row { background:#f7f7ff; }
td:first-child input {
  width:60px;
}

.mode {
  font-weight:600;
  min-width:90px;
}

  </style>
</head>
<body>

<div id="gate">
  <h2>Pricing Guide V4</h2>
  <input type="password" id="passcode" placeholder="Passcode" />
  <button onclick="unlock()">Unlock</button>
</div>

<div id="app" class="hidden">
  <h2>Pricing Guide V4</h2>
  <button onclick="addRow()">+ Add Item</button>
  <button onclick="exportCSV()">Export CSV</button>

  <table id="pricingTable">
    <thead>
      <tr>
        <th>Item</th>
        <th>Mode</th>
        <th>Commodity</th>
        <th>FOB</th>
        <th>Exch</th>
        <th>Supplier Cost</th>
        <th>Other Cost</th>
        <th>Total Cost</th>
        <th>M%</th>
        <th>System MRP</th>
        <th>Rounded</th>
        <th>Reverse</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
