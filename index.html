<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Guide v3</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- PASSCODE SCREEN -->
<div id="gate" class="gate">
  <div class="gate-card">
    <h2>Pricing Guide v3</h2>
    <p>Enter passcode to continue</p>
    <input type="password" id="passcode" placeholder="Passcode" />
    <button onclick="unlock()">Unlock</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <h1>Pricing Guide v3</h1>
    <div class="actions">
      <button onclick="addRow()">+ Add Item</button>
      <button onclick="exportCSV()">Export CSV</button>
    </div>
  </header>

  <div class="table-wrap">
    <table id="pricingTable">
      <thead>
        <tr>
          <th>Item</th>
          <th>Commodity</th>
          <th>FOB USD</th>
          <th>USD LKR</th>
          <th>Landed Cost</th>
          <th>Target Margin %</th>
          <th>System MRP</th>
          <th>Final MRP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
